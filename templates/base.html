{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Futbol Torneos{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="bg-gray-100 min-h-screen">

    {% include 'navbar.html' %}

    {% if messages %}
        <div id="toast-root" class="fixed top-4 right-4 z-[60] flex w-full max-w-sm flex-col gap-2 px-4 sm:px-0">
            {% for message in messages %}
                <div class="toast-message flex items-start gap-3 rounded-2xl border p-4 shadow-lg
                    {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800
                    {% elif message.tags == 'warning' %}bg-yellow-50 border-yellow-200 text-yellow-800
                    {% else %}bg-green-50 border-green-200 text-green-800{% endif %}">
                    <p class="flex-1 text-sm font-medium">{{ message }}</p>
                    <button type="button" onclick="this.closest('.toast-message').remove()" class="text-current opacity-60 hover:opacity-100">✕</button>
                </div>
            {% endfor %}
        </div>
        <script>
            setTimeout(function () {
                document.querySelectorAll('.toast-message').forEach(function (el) { el.remove(); });
            }, 6000);
        </script>
    {% endif %}

    <main>
        {% block contenido %}
        {% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
