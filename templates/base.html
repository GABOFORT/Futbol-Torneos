{% load static estaticos %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Futbol Torneos{% endblock %}</title>
    <link rel="stylesheet" href="{% static_v 'css/tailwind.css' %}">
    <style>
        /* Flecha propia para los <select>: la nativa del sistema se ve pegada al
           borde y desalineada contra el borde redondeado del campo.
           Va en CSS plano porque el build de Tailwind esta purgado y solo escanea
           templates/, asi que clases nuevas puestas desde forms.py no existirian.
           El selector usa [class] para ganarle en especificidad al px-4 de Tailwind. */
        select[class]:not([multiple]) {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20fill='none'%20viewBox='0%200%2024%2024'%20stroke-width='2'%20stroke='%236b7280'%3E%3Cpath%20stroke-linecap='round'%20stroke-linejoin='round'%20d='m19.5%208.25-7.5%207.5-7.5-7.5'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            /* derecha con 1rem de aire, centrada verticalmente */
            background-position: right 1rem center;
            background-size: 1.1rem 1.1rem;
            padding-right: 2.75rem;
        }

        /* Campo obligatorio vacio al intentar guardar. Se listan los tres tipos
           para ganarle en especificidad al focus:border-green-600 de Tailwind,
           que si no repinta el borde en verde justo al enfocar el campo. */
        input.campo-invalido,
        select.campo-invalido,
        textarea.campo-invalido {
            border-color: #dc2626;
            box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.18);
        }

        .error-campo {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #dc2626;
        }

        /* Resalta la opcion elegida. Va en CSS plano porque el build de Tailwind
           no trae las variantes has-[], estan purgadas. */
        .opcion-radio:has(input:checked) {
            border-color: #16a34a;
            background-color: #f0fdf4;
        }

        /* ---- Botones de la columna Acciones ----
           En CSS plano porque el build purgado no trae justify-end, py-1.5,
           whitespace-nowrap ni hover:bg-red-50. */
        .acciones {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            /* nowrap a proposito: la columna se encoge a su contenido, y si los
               botones pudieran partir se apilarian uno debajo del otro. La tabla
               ya tiene scroll horizontal para pantallas angostas. */
            flex-wrap: nowrap;
            gap: 0.5rem;
        }

        .btn-accion {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.375rem 0.875rem;
            border: 1px solid #bbf7d0;
            border-radius: 9999px;
            background-color: #fff;
            color: #15803d;
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.25rem;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color .15s ease, border-color .15s ease;
        }

        .btn-accion:hover {
            background-color: #f0fdf4;
            border-color: #4ade80;
        }

        .btn-accion svg {
            height: 0.875rem;
            width: 0.875rem;
        }

        .btn-accion-peligro {
            border-color: #fecaca;
            color: #b91c1c;
        }

        .btn-accion-peligro:hover {
            background-color: #fef2f2;
            border-color: #f87171;
        }

        /* La columna de acciones se encoge hasta el ancho de sus botones. Sin
           esto se queda con todo el espacio sobrante y el titulo ACCIONES
           termina despegado de los botones que encabeza. */
        .col-acciones {
            width: 1%;
            white-space: nowrap;
            text-align: right;
        }

        /* Numero de fila: angosta y discreta, no compite con los datos. */
        .col-numero {
            width: 1%;
            white-space: nowrap;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Cuando falta un dato: se dice cual falta, en vez de un guion que no
           distingue "sin liga" de "sin equipo". */
        .sin-dato {
            font-size: 0.75rem;
            font-style: italic;
            color: #9ca3af;
            white-space: nowrap;
        }

        /* Chip para valores que pueden venir de a varios (ligas, equipos). */
        .etiqueta-tabla {
            display: inline-block;
            margin: 0.125rem 0.25rem 0.125rem 0;
            padding: 0.125rem 0.625rem;
            border-radius: 9999px;
            background-color: #f0fdf4;
            border: 1px solid #dcfce7;
            color: #166534;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Boton de confirmar borrado. En CSS plano porque el build purgado no
           trae bg-red-700 ni hover:bg-red-800: con las clases de Tailwind el
           boton quedaba con texto blanco sobre fondo blanco, o sea invisible. */
        .btn-peligro {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: 1px solid transparent;
            border-radius: 9999px;
            background-color: #b91c1c;
            color: #fff;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .15s ease;
        }

        .btn-peligro:hover {
            background-color: #991b1b;
        }

        .btn-peligro svg {
            height: 1rem;
            width: 1rem;
        }

        /* Del build purgado no sobrevivio ningun hover rojo (hover:bg-red-50,
           hover:text-red-900...), asi que los estados en rojo se definen aca. */
        .btn-contorno-peligro:hover {
            background-color: #fef2f2;
            border-color: #f87171;
        }

        .texto-peligro:hover {
            color: #7f1d1d;
        }

        /* ---- Avatar del jugador ----
           Sin foto se muestra la camiseta y el numero va superpuesto por CSS.
           El PNG queda intacto y sirve para cualquier dorsal. */
        .avatar-jugador {
            height: 3rem;
            width: 3rem;
            flex-shrink: 0;
            border-radius: 9999px;
            object-fit: cover;
            border: 1px solid #dcfce7;
        }

        /* El font-size de .dorsal define el tamano de la camiseta y todo lo de
           adentro se mide en em, asi que basta cambiarlo para escalar el
           conjunto sin retocar el numero por separado. */
        .dorsal {
            position: relative;
            display: inline-block;
            font-size: 3rem;
            height: 1em;
            width: 1em;
            flex-shrink: 0;
            background-image: url("{% static_v 'img/dorsal-numero.png' %}");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        .dorsal-numero {
            position: absolute;
            left: 0;
            right: 0;
            /* 62% y no 50%: el hueco libre de la camiseta esta debajo del centro. */
            top: 62%;
            transform: translateY(-50%);
            text-align: center;
            color: #fff;
            font-size: 0.3em;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.02em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        }

        /* Un dorsal de 3 o 4 cifras no entra al mismo cuerpo que uno de 2:
           se achica la letra segun cuantos digitos trae. */
        .dorsal[data-digitos="3"] .dorsal-numero {
            font-size: 0.23em;
            letter-spacing: -0.04em;
        }

        .dorsal[data-digitos="4"] .dorsal-numero {
            font-size: 0.18em;
            letter-spacing: -0.05em;
        }

        /* Version grande, para la ficha del jugador */
        .dorsal-lg {
            font-size: 5rem;
        }

        /* ---- Barra de filtros de los listados ----
           Flex y no grid: los campos son de distinta cantidad segun la
           pantalla, y con flex-wrap se acomodan solos sin definir columnas. */
        .barra-filtros {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.625rem;
            padding: 0.75rem;
            border: 1px solid #dcfce7;
            border-radius: 1.25rem;
            background-color: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        /* El buscador se queda con el espacio sobrante: es donde mas se escribe. */
        .filtro-busqueda {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1 1 16rem;
            min-width: 12rem;
        }

        .filtro-lupa {
            position: absolute;
            left: 0.875rem;
            height: 1.125rem;
            width: 1.125rem;
            color: #9ca3af;
            pointer-events: none;
        }

        .filtro-texto {
            width: 100%;
            padding: 0.625rem 2.5rem 0.625rem 2.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 9999px;
            background-color: #f9fafb;
            font-size: 0.875rem;
            color: #111827;
        }

        .filtro-texto:focus {
            outline: none;
            background-color: #fff;
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        }

        /* La X de limpiar que dibuja el navegador en los input[type=search] */
        .filtro-texto::-webkit-search-cancel-button { cursor: pointer; }

        /* Puntito que gira mientras se traen los resultados */
        .filtro-cargando {
            position: absolute;
            right: 0.875rem;
            height: 1rem;
            width: 1rem;
            border: 2px solid #d1d5db;
            border-top-color: #16a34a;
            border-radius: 9999px;
            opacity: 0;
            transition: opacity .15s ease;
        }

        [data-filtros].cargando .filtro-cargando {
            opacity: 1;
            animation: girar .7s linear infinite;
        }

        @keyframes girar { to { transform: rotate(360deg); } }

        .filtro-select {
            flex: 0 1 auto;
            max-width: 14rem;
            padding: 0.625rem 2.5rem 0.625rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 9999px;
            background-color: #f9fafb;
            font-size: 0.875rem;
            color: #111827;
            cursor: pointer;
        }

        .filtro-select:focus {
            outline: none;
            background-color: #fff;
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        }

        .filtro-limpiar {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #b91c1c;
            white-space: nowrap;
        }

        .filtro-limpiar:hover { background-color: #fef2f2; }

        /* margin-left:auto empuja el contador contra el borde derecho */
        .filtro-contador {
            margin-left: auto;
            padding-right: 0.5rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #6b7280;
            white-space: nowrap;
        }

        /* Solo se ve sin JavaScript: con JS el filtrado es automatico. */
        .filtro-enviar { display: none; }

        /* Los resultados se atenuan mientras llega el reemplazo, para que se
           note que algo esta pasando sin que la pagina salte. */
        [data-resultados].cargando {
            opacity: 0.45;
            transition: opacity .15s ease;
            pointer-events: none;
        }

        /* ---- Logo de la liga ---- */
        .logo-liga {
            height: 2.5rem;
            width: 2.5rem;
            flex-shrink: 0;
            border-radius: 9999px;
            object-fit: contain;
            background-color: #fff;
            border: 1px solid #dcfce7;
        }

        .logo-liga-iniciales {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #dcfce7;
            color: #166534;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        /* Version grande, para encabezar la pagina de una liga */
        .logo-liga-lg {
            height: 4rem;
            width: 4rem;
            font-size: 1.25rem;
        }

        /* Escudos de equipo. Tailwind trae h-12 y h-20 pero no sus anchos, y sin
           ancho la imagen se deforma. */
        .escudo-mini {
            height: 3rem;
            width: 3rem;
            object-fit: contain;
        }

        .escudo-grande {
            height: 5rem;
            width: 5rem;
            object-fit: contain;
        }

        /* Fila de botones del pie del modal: en fila y a la derecha en pantalla
           normal, apilados y a lo ancho en el celular. */
        .acciones-modal {
            display: flex;
            flex-direction: column-reverse;
            gap: 0.75rem;
            padding-top: 1.5rem;
            margin-top: 1rem;
            border-top: 1px solid #f3f4f6;
        }

        @media (min-width: 640px) {
            .acciones-modal {
                flex-direction: row;
                justify-content: flex-end;
            }
        }

        /* ---- Identificacion del usuario en la barra superior ---- */
        .usuario-chip {
            display: none;
            align-items: center;
            gap: 0.625rem;
            padding: 0.25rem 0.875rem 0.25rem 0.25rem;
            border-radius: 9999px;
            background-color: rgba(255, 255, 255, 0.12);
        }

        @media (min-width: 768px) {
            .usuario-chip { display: flex; }
        }

        .usuario-avatar {
            height: 2rem;
            width: 2rem;
            flex-shrink: 0;
            border-radius: 9999px;
            background-color: #fff;
            color: #166534;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .usuario-datos {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
            min-width: 0;
        }

        .usuario-nombre {
            color: #fff;
            font-size: 0.8125rem;
            font-weight: 600;
            max-width: 10rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .usuario-rol {
            color: #bbf7d0;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        /* ---- Campo de subida de archivos ----
           Acompana a templates/django/forms/widgets/clearable_file_input.html */
        .campo-archivo-actual {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.5rem;
            padding: 0.625rem 0.875rem;
            border: 1px solid #d1d5db;
            border-radius: 1rem;
            background-color: #f9fafb;
        }

        .campo-archivo-miniatura {
            height: 2.75rem;
            width: 2.75rem;
            flex-shrink: 0;
            border-radius: 0.75rem;
            object-fit: contain;
            background-color: #fff;
            border: 1px solid #e5e7eb;
        }

        .campo-archivo-nombre {
            font-size: 0.8125rem;
            color: #4b5563;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .campo-archivo-nombre:hover {
            color: #15803d;
            text-decoration: underline;
        }

        /* margin-left:auto es lo que empuja el "Eliminar" contra el borde derecho */
        .campo-archivo-borrar {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            padding: 0.375rem 0.75rem;
            border: 1px solid #fecaca;
            border-radius: 9999px;
            background-color: #fff;
            color: #b91c1c;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .campo-archivo-borrar:hover {
            background-color: #fef2f2;
            border-color: #f87171;
        }

        .campo-archivo-borrar input {
            height: 0.875rem;
            width: 0.875rem;
            accent-color: #b91c1c;
            cursor: pointer;
        }

        .campo-archivo input[type="file"] {
            display: block;
            width: 100%;
            margin-top: 0.5rem;
            font-size: 0.8125rem;
            color: #4b5563;
        }

        .campo-archivo input[type="file"]::file-selector-button {
            margin-right: 0.75rem;
            padding: 0.5rem 1rem;
            border: 1px solid #bbf7d0;
            border-radius: 9999px;
            background-color: #fff;
            color: #15803d;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .campo-archivo input[type="file"]::file-selector-button:hover {
            background-color: #f0fdf4;
            border-color: #4ade80;
        }
    </style>
    <script defer src="{% static_v 'js/forms.js' %}"></script>
    <script defer src="{% static_v 'js/filtros.js' %}"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    {% include 'navbar.html' %}

    {% if messages %}
        <div id="toast-root" class="fixed top-4 right-4 z-[60] flex w-full max-w-sm flex-col gap-2 px-4 sm:px-0">
            {% for message in messages %}
                <div class="toast-message flex items-start gap-3 rounded-2xl border p-4 shadow-lg
                    {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800
                    {% elif message.tags == 'warning' %}bg-yellow-50 border-yellow-200 text-yellow-800
                    {% else %}bg-green-50 border-green-200 text-green-800{% endif %}">
                    <p class="flex-1 text-sm font-medium">{{ message }}</p>
                    <button type="button" onclick="this.closest('.toast-message').remove()" class="text-current opacity-60 hover:opacity-100">✕</button>
                </div>
            {% endfor %}
        </div>
        <script>
            setTimeout(function () {
                document.querySelectorAll('.toast-message').forEach(function (el) { el.remove(); });
            }, 6000);
        </script>
    {% endif %}

    <main>
        {% block contenido %}
        {% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
