{% if patrocinador.video %}
    <button type="button" class="ficha-boton" data-aliado-video-abrir>
        <svg class="aliado-video-icono" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.9-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z"/></svg>
        Ver video
    </button>
    <dialog class="aliado-video" aria-label="Video de {{ patrocinador.nombre }}">
        <div class="aliado-video-cabecera">
            <p class="aliado-video-titulo">{{ patrocinador.nombre }}</p>
            <button type="button" class="aliado-video-cerrar" data-aliado-video-cerrar aria-label="Cerrar video">&#10005;</button>
        </div>
        <video src="{{ patrocinador.video.url }}" controls playsinline preload="none"></video>
    </dialog>
{% endif %}
