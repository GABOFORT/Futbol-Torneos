<div>
    <label class="block text-sm font-medium text-gray-700">{{ field.label }}</label>
    {% if field.help_text %}
        <p class="mt-1 text-sm text-gray-500">{{ field.help_text }}</p>
    {% endif %}
    <div class="mt-3 grid gap-2 sm:grid-cols-2">
        {% for checkbox in field %}
            <label class="flex items-center gap-3 rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-800 cursor-pointer hover:border-green-400 has-[:checked]:border-green-600 has-[:checked]:bg-green-50">
                {{ checkbox.tag }}
                <span>{{ checkbox.choice_label }}</span>
            </label>
        {% empty %}
            <p class="text-sm text-gray-500">No hay categorías disponibles todavía. Crea una categoría primero.</p>
        {% endfor %}
    </div>
    {% for error in field.errors %}
        <p class="mt-2 text-sm text-red-600">{{ error }}</p>
    {% endfor %}
</div>
