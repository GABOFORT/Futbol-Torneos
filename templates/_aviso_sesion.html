{% load sesion %}

<div id="sesion-aviso"
     class="sesion-fondo"
     hidden
     role="alertdialog"
     aria-modal="true"
     aria-labelledby="sesion-titulo"
     aria-describedby="sesion-texto"
     data-total="{{ request.session.get_expiry_age }}"
     data-aviso="{% segundos_aviso_sesion %}"
     data-url-renovar="{% url 'sesion-renovar' %}"
     data-url-expirada="{% url 'sesion-expirada' %}"
     data-csrf="{{ csrf_token }}">

    <div class="sesion-tarjeta" role="document">

        <div class="sesion-reloj">
            <svg class="sesion-anillo" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
                <circle class="sesion-anillo-fondo" cx="60" cy="60" r="52"></circle>
                <circle id="sesion-anillo-avance" class="sesion-anillo-avance" cx="60" cy="60" r="52"></circle>
            </svg>
            <span id="sesion-reloj-texto" class="sesion-reloj-texto" aria-live="polite" aria-atomic="true">2:00</span>
        </div>

        <p class="sesion-etiqueta">Sesión por vencer</p>
        <h2 id="sesion-titulo" class="sesion-titulo">¿Sigues ahí?</h2>

        <p id="sesion-texto" class="sesion-texto">
            No detectamos actividad, así que tu sesión se cerrará sola por seguridad.
            Si estás trabajando, pulsa <strong>Seguir conectado</strong> y continúas donde ibas.
        </p>

        <div class="sesion-acciones">
            <button type="button" id="sesion-seguir" class="sesion-boton">
                Seguir conectado
            </button>

            <form action="{% url 'logout' %}" method="post" class="sesion-forma-salir">
                {% csrf_token %}
                <button type="submit" class="sesion-boton sesion-boton-tenue">Cerrar sesión ahora</button>
            </form>
        </div>

        <p class="sesion-pie">Tu trabajo sin guardar se pierde al cerrarse la sesión.</p>
    </div>
</div>
