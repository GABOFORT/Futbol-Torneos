<div class="torneo-ui siembra-marco">
    {% include 'torneos/_iconos.html' %}

    <header class="siembra-cabecera">
        <span class="siembra-copa" aria-hidden="true">
            <svg class="ico"><use href="#ico-copa"></use></svg>
        </span>
        <div class="min-w-0">
            <p class="siembra-kicker">{{ torneo.nombre }}</p>
            <h2>Armar la liguilla</h2>
            <p class="siembra-sub">{{ categoria.nombre }}</p>
        </div>
        <button type="button" id="modal-close" class="siembra-cerrar" aria-label="Cerrar">✕</button>
    </header>

    <form id="modal-form" method="post" novalidate class="siembra-cuerpo"
          data-llaves-por-ronda="{% for fase, cuantas in llaves_por_ronda.items %}{{ fase }}:{{ cuantas }}{% if not forloop.last %},{% endif %}{% endfor %}">
        {% csrf_token %}
        {% include 'torneos/_siembra_form.html' %}

        <footer class="siembra-pie">
            <button type="button" id="modal-cancel" class="boton-fantasma">Cancelar</button>
            <button type="submit" class="boton-oro">
                <svg class="ico ico-sm"><use href="#ico-listo"></use></svg>
                Guardar la liguilla
            </button>
        </footer>
    </form>
</div>
