
{% if trofeos %}
    <span class="trofeos{% if tam %} trofeos-{{ tam }}{% endif %}">
        {% for trofeo in trofeos %}

            <img src="{{ trofeo.imagen }}" alt="{{ trofeo.etiqueta }}" title="{{ trofeo.etiqueta }}" class="trofeo" loading="lazy" decoding="async">
        {% endfor %}
    </span>
{% endif %}
