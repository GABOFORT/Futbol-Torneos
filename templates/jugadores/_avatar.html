
{% if jugador.foto %}
    <img src="{{ jugador.foto.url }}" alt="Foto de {{ jugador.nombre }} {{ jugador.apellido }}" class="avatar-jugador" loading="lazy" decoding="async">
{% else %}
    <span class="dorsal" role="img" data-digitos="{% if jugador.numero is not None %}{{ jugador.numero|stringformat:'s'|length }}{% endif %}"
          aria-label="{% if jugador.numero %}Dorsal {{ jugador.numero }}{% else %}Sin foto ni número{% endif %}">
        {% if jugador.numero is not None %}<span class="dorsal-numero">{{ jugador.numero }}</span>{% endif %}
    </span>
{% endif %}
