<div id="modal-root" class="fixed inset-0 hidden items-center justify-center bg-black/40 p-4 z-50"></div>

<script>
(function () {
  function closeModal() {
    const root = document.getElementById('modal-root');
    root.classList.add('hidden');
    root.classList.remove('flex');
    root.innerHTML = '';
  }

  // Engancha todo el HTML recien inyectado en el modal. Se vuelve a llamar
  // cuando el servidor rechaza el formulario y lo redibuja, porque ese HTML
  // trae un <form> nuevo y el listener anterior murio con el viejo.
  function bindModal(url) {
    const root = document.getElementById('modal-root');
    // Se consulta con guardas porque la respuesta no siempre es el modal: si la
    // vista redirige (por ejemplo al topar el limite de ligas) llega la pagina
    // entera, sin estos elementos.
    const cerrar = document.getElementById('modal-close');
    const cancelar = document.getElementById('modal-cancel');
    if (cerrar) cerrar.onclick = closeModal;
    if (cancelar) cancelar.onclick = closeModal;
    // Ojo de contrasena, capitalizacion y obligatorios en rojo: static/js/forms.js
    window.initFormulario(root);
    // El mapa para marcar la cancha, cuando la pantalla cargo Leaflet.
    if (window.initSede) window.initSede(root);

    const form = document.getElementById('modal-form');
    if (!form) return;
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const data = new FormData(form);
      fetch(url, { method: 'POST', body: data, cache: 'no-store' })
        .then(response => response.text())
        .then(text => {
          try {
            const json = JSON.parse(text);
            if (json.success) {
              location.reload();
            }
          } catch (error) {
            root.innerHTML = text;
            bindModal(url);
          }
        });
    });
  }

  // Mientras viaja la peticion la ventana se abre con un indicador. Sin esto
  // el modal se quedaba mudo: en una conexion lenta parecia que el clic no
  // habia hecho nada y la gente volvia a pulsar.
  function abrirCargando() {
    const root = document.getElementById('modal-root');
    root.innerHTML = '<div class="modal-cargando" role="status" aria-live="polite">' +
                     '<span class="modal-girador"></span>' +
                     '<span class="modal-cargando-texto">Cargando…</span></div>';
    root.classList.remove('hidden');
    root.classList.add('flex');
  }

  function openModal(url) {
    abrirCargando();
    // no-store: el HTML del modal se pide por fetch, y sin esto el navegador
    // devuelve la version cacheada aunque el template ya haya cambiado.
    fetch(url, { cache: 'no-store' })
      .then(res => res.text())
      .then(html => {
        // La vista no siempre devuelve el modal: si niega el acceso (por ejemplo
        // al topar el limite de ligas) responde JSON pidiendo recargar, y el
        // mensaje sale como toast en vez de abrirse una ventana vacia.
        if (recargarSiCorresponde(html)) { closeModal(); return; }
        const root = document.getElementById('modal-root');
        root.innerHTML = html;
        bindModal(url);
      })
      .catch(function () {
        // Un error de red no puede dejar la ventana girando para siempre.
        const root = document.getElementById('modal-root');
        root.innerHTML = '<div class="modal-cargando" role="alert">' +
                         '<span class="modal-cargando-texto">No se pudo cargar. Revisá tu conexión e intentá de nuevo.</span></div>';
      });
  }

  function recargarSiCorresponde(texto) {
    try {
      if (JSON.parse(texto).recargar) {
        location.reload();
        return true;
      }
    } catch (error) {
      // Es HTML, o sea el modal de verdad.
    }
    return false;
  }

  document.addEventListener('click', function (event) {
    const trigger = event.target.closest('.open-modal');
    if (trigger) {
      event.preventDefault();
      openModal(trigger.dataset.url);
    }
  });

  // Hay disparadores que no son botones, como la tarjeta del calendario que
  // abre la ficha del partido. Con el teclado esos no reciben el clic solos, asi
  // que se les traduce Enter y espacio. A un <button> o un <a> no hay que
  // traducirles nada: el navegador ya les dispara el clic y se abriria dos veces.
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const trigger = event.target.closest('.open-modal');
    if (!trigger || trigger.tagName === 'BUTTON' || trigger.tagName === 'A') return;
    event.preventDefault();
    openModal(trigger.dataset.url);
  });

  // Cerrar con Escape y con un clic en el fondo: la ficha es larga y el boton de
  // cerrar puede quedar lejos si el usuario ya scrolleo.
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeModal();
  });

  document.getElementById('modal-root').addEventListener('click', function (event) {
    if (event.target === this) closeModal();
  });
})();
</script>
