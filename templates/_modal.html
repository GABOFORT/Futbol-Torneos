<div id="modal-root" class="fixed inset-0 hidden items-center justify-center bg-black/40 p-4 z-50"></div>

<script>
(function () {
  function closeModal() {
    const root = document.getElementById('modal-root');
    root.classList.add('hidden');
    root.classList.remove('flex');
    root.innerHTML = '';
  }

  function bindModal(url) {
    const root = document.getElementById('modal-root');

    const cerrar = document.getElementById('modal-close');
    const cancelar = document.getElementById('modal-cancel');
    if (cerrar) cerrar.onclick = closeModal;
    if (cancelar) cancelar.onclick = closeModal;

    window.initFormulario(root);

    if (window.initSede) window.initSede(root);

    if (window.initAliado) window.initAliado(root);

    const form = document.getElementById('modal-form');
    if (!form) return;
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const data = new FormData(form);
      fetch(url, { method: 'POST', body: data, cache: 'no-store' })
        .then(response => response.text())
        .then(text => {
          try {
            const json = JSON.parse(text);
            if (json.success) {
              location.reload();
            }
          } catch (error) {
            root.innerHTML = text;
            bindModal(url);
          }
        });
    });
  }

  function abrirCargando() {
    const root = document.getElementById('modal-root');
    root.innerHTML = '<div class="modal-cargando" role="status" aria-live="polite">' +
                     '<span class="modal-girador"></span>' +
                     '<span class="modal-cargando-texto">Cargando…</span></div>';
    root.classList.remove('hidden');
    root.classList.add('flex');
  }

  function openModal(url) {
    abrirCargando();

    fetch(url, { cache: 'no-store' })
      .then(res => res.text())
      .then(html => {

        if (recargarSiCorresponde(html)) { closeModal(); return; }
        const root = document.getElementById('modal-root');
        root.innerHTML = html;
        bindModal(url);
      })
      .catch(function () {

        const root = document.getElementById('modal-root');
        root.innerHTML = '<div class="modal-cargando" role="alert">' +
                         '<span class="modal-cargando-texto">No se pudo cargar. Revisa tu conexión e inténtalo de nuevo.</span></div>';
      });
  }

  function recargarSiCorresponde(texto) {
    try {
      if (JSON.parse(texto).recargar) {
        location.reload();
        return true;
      }
    } catch (error) {

    }
    return false;
  }

  document.addEventListener('click', function (event) {
    const trigger = event.target.closest('.open-modal');
    if (trigger) {
      event.preventDefault();
      openModal(trigger.dataset.url);
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const trigger = event.target.closest('.open-modal');
    if (!trigger || trigger.tagName === 'BUTTON' || trigger.tagName === 'A') return;
    event.preventDefault();
    openModal(trigger.dataset.url);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeModal();
  });

  document.getElementById('modal-root').addEventListener('click', function (event) {
    if (event.target === this) closeModal();
  });
})();
</script>
